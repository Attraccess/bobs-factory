name: Website

# Builds website PRs and publishes main/releases to GitHub Pages.
on:
  push:
    branches:
      - main
    paths:
      - 'website/**'
      - 'scripts/install.sh'
      - 'scripts/sync-release-metadata.mjs'
      - 'scripts/lib/binary-release.mjs'
      - '.github/workflows/website.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'website/**'
      - 'scripts/install.sh'
      - 'scripts/sync-release-metadata.mjs'
      - 'scripts/lib/binary-release.mjs'
      - '.github/workflows/website.yml'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'deploy' }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: pnpm
          cache-dependency-path: website/pnpm-lock.yaml

      - id: pages
        uses: actions/configure-pages@v6

      - name: Install website dependencies
        run: pnpm install --frozen-lockfile

      - name: Synchronize public installer and release metadata
        working-directory: .
        run: node scripts/sync-release-metadata.mjs

      - name: Build website
        env:
          # "/bobs-factory" on github.io, "" once a custom domain is configured.
          SITE_BASE: ${{ steps.pages.outputs.base_path }}/
        run: pnpm build

      - uses: actions/upload-pages-artifact@v5
        with:
          path: website/dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
