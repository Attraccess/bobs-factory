name: Prepare verified stable or nightly candidates
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      channel:
        description: Nightly preparation or promotion of an explicitly published nightly
        type: choice
        options: [nightly, stable]
        default: nightly
      nightly_tag:
        description: Exact verified published nightly tag for stable promotion
        type: string
      stable_version:
        description: New stable version; never includes newer main changes
        type: string
      activate:
        description: Create remote candidate, run native gates and publish only when real evidence is available (requires separate rollout)
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
# Shared with manual binary publication: cooldown and pointer decisions cannot race.
concurrency:
  group: bobs-factory-publication
  cancel-in-progress: false
jobs:
  dry-run:
    if: github.event_name == 'workflow_dispatch' && !inputs.activate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24.18.0'
          package-manager-cache: false
      - name: Prepare without remote writes
        env:
          GH_TOKEN: ${{ github.token }}
          CHANNEL: ${{ inputs.channel }}
          NIGHTLY: ${{ inputs.nightly_tag }}
          VERSION: ${{ inputs.stable_version }}
        run: node scripts/orchestrate-release.mjs --channel "$CHANNEL" --nightly "$NIGHTLY" --version "$VERSION" --output "$RUNNER_TEMP/release-candidate"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: release-candidate-dry-run-${{ github.run_id }}
          path: ${{ runner.temp }}/release-candidate/
          if-no-files-found: ignore
  authorized:
    if: vars.BOBS_FACTORY_RELEASE_AUTOMATION == 'enabled' && (github.event_name == 'schedule' || inputs.activate)
    environment: ${{ inputs.channel == 'stable' && 'stable-release' || 'nightly-release' }}
    permissions:
      contents: write
      actions: write
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24.18.0'
          package-manager-cache: false
      - name: Reserve immutable candidate, run native builds and require real evidence
        env:
          GH_TOKEN: ${{ github.token }}
          BOBS_FACTORY_RELEASE_AUTOMATION: ${{ vars.BOBS_FACTORY_RELEASE_AUTOMATION }}
          BOBS_FACTORY_STABLE_RELEASE_APPROVED: ${{ inputs.channel == 'stable' && 'true' || 'false' }}
          CHANNEL: ${{ inputs.channel || 'nightly' }}
          NIGHTLY: ${{ inputs.nightly_tag }}
          VERSION: ${{ inputs.stable_version }}
        run: node scripts/orchestrate-release.mjs --channel "$CHANNEL" --nightly "$NIGHTLY" --version "$VERSION" --activate --output "$RUNNER_TEMP/release-candidate"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: release-candidate-${{ github.run_id }}
          path: ${{ runner.temp }}/release-candidate/
          if-no-files-found: ignore
