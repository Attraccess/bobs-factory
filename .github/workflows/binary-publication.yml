name: Stage or publish one immutable binary candidate
on:
  workflow_call:
    inputs:
      candidate_sha:
        required: true
        type: string
      version:
        required: true
        type: string
      binary_run_id:
        required: true
        type: string
      evidence_artifact_id:
        required: true
        type: string
      publish:
        required: true
        type: boolean
jobs:
  release:
    environment: ${{ inputs.publish && (!contains(inputs.version, '-') && 'stable-release' || 'nightly-release') || 'release-preparation' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.candidate_sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: '24.18.0'
          package-manager-cache: false
      - name: Retrieve candidate-bound release evidence
        env:
          BOBS_FACTORY_RELEASE_AUTOMATION: ${{ vars.BOBS_FACTORY_RELEASE_AUTOMATION }}
          BOBS_FACTORY_STABLE_RELEASE_APPROVED: ${{ inputs.publish && !contains(inputs.version, '-') && 'true' || 'false' }}
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          EVIDENCE_ARTIFACT_ID: ${{ inputs.evidence_artifact_id }}
        run: node scripts/download-release-evidence.mjs --sha "$CANDIDATE_SHA" --artifact-id "$EVIDENCE_ARTIFACT_ID" --output "$RUNNER_TEMP/release-evidence"
      - name: Validate and stage public binary assets
        env:
          BOBS_FACTORY_RELEASE_AUTOMATION: ${{ vars.BOBS_FACTORY_RELEASE_AUTOMATION }}
          BOBS_FACTORY_STABLE_RELEASE_APPROVED: ${{ inputs.publish && !contains(inputs.version, '-') && 'true' || 'false' }}
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          RELEASE_VERSION: ${{ inputs.version }}
          BINARY_RUN_ID: ${{ inputs.binary_run_id }}
          PUBLISH_RELEASE: ${{ inputs.publish }}
        run: |
          args=()
          if [[ "$PUBLISH_RELEASE" == true ]]; then args+=(--publish); fi
          node scripts/publish-binary-release.mjs --sha "$CANDIDATE_SHA" --version "$RELEASE_VERSION" --run-id "$BINARY_RUN_ID" --evidence "$RUNNER_TEMP/release-evidence/release-evidence.json" --output "$RUNNER_TEMP/public-release" "${args[@]}"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: bobs-factory-publication-plan-${{ inputs.candidate_sha }}
          path: ${{ runner.temp }}/public-release/
          if-no-files-found: ignore
