name: Verify Bob’s Factory binary candidate
on:
  workflow_call:
    inputs:
      candidate_json:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      candidate_json:
        description: Frozen candidate.json bytes, including digest and reviewed tooling SHA
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: bobs-factory-binary-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  binary:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-arm64
            runner: macos-15
          - target: darwin-x64
            runner: macos-15-intel
          - target: linux-x64
            runner: ubuntu-24.04
          - target: linux-arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ fromJSON(inputs.candidate_json).candidate.workflowSha }}
          path: tooling
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          ref: ${{ fromJSON(inputs.candidate_json).candidate.commit }}
          path: source
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24.18.0'
          package-manager-cache: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - name: Validate frozen source and workflow
        env:
          EXPECTED_TOOLING_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          CANDIDATE_JSON: ${{ inputs.candidate_json }}
        run: |
          node --input-type=module -e 'import {writeFileSync} from "node:fs"; import {execFileSync} from "node:child_process"; import {validateCandidate} from "./tooling/scripts/lib/release-candidate.mjs"; const r=validateCandidate(JSON.parse(process.env.CANDIDATE_JSON)); if(r.candidate.workflowSha!==process.env.EXPECTED_TOOLING_SHA) throw Error("Run from frozen event tooling"); for(const [path,sha] of [["tooling",r.candidate.workflowSha],["source",r.candidate.commit]]) if(execFileSync("git",["-C",path,"rev-parse","HEAD"],{encoding:"utf8"}).trim()!==sha) throw Error("Frozen checkout mismatch"); writeFileSync(process.env.RUNNER_TEMP+"/candidate.json",process.env.CANDIDATE_JSON)'
          corepack enable
          corepack prepare "$(node -p 'require("./source/package.json").packageManager')" --activate
      - run: pnpm install --frozen-lockfile
        working-directory: source
      - run: pnpm --filter 'bobs-factory...' build
        working-directory: source
      - name: Build the frozen release version without editing source
        env:
          VERSION: ${{ fromJSON(inputs.candidate_json).candidate.version }}
          TARGET: ${{ matrix.target }}
        run: bun run tooling/scripts/build-binary.ts --source-root source --candidate "$RUNNER_TEMP/candidate.json" --release-version "$VERSION" --target "$TARGET" --output "$RUNNER_TEMP/artifacts"
      - name: Native runtime and isolated installer smoke
        env:
          VERSION: ${{ fromJSON(inputs.candidate_json).candidate.version }}
          TARGET: ${{ matrix.target }}
        run: |
          ./tooling/scripts/install-binary.sh "$RUNNER_TEMP/artifacts/bobs-factory-$VERSION-$TARGET.tar.gz" "$RUNNER_TEMP/artifacts/bobs-factory-$VERSION-$TARGET.manifest.json" "$RUNNER_TEMP/factory-prefix"
          ./tooling/scripts/smoke-binary.sh "$RUNNER_TEMP/factory-prefix/bin/bobs-factory" | tee "$RUNNER_TEMP/artifacts/runtime-smoke.txt"
      - name: Public installer with native archives and controlled signed downloads
        run: node tooling/scripts/smoke-public-install.mjs --artifacts "$RUNNER_TEMP/artifacts"
      - name: Native scoped helpers with controlled HTTPS
        run: node tooling/scripts/smoke-native-helpers.mjs --binary "$RUNNER_TEMP/factory-prefix/bin/bobs-factory" --output "$RUNNER_TEMP/artifacts"
      - name: Prepared agent protocol boundaries without live inference
        run: node tooling/scripts/smoke-prepared-agent-boundaries.mjs --source-root source --binary "$RUNNER_TEMP/factory-prefix/bin/bobs-factory" --output "$RUNNER_TEMP/artifacts"
      - name: Packed npm trial lifecycle with native runtime and controlled browser
        env:
          VERSION: ${{ fromJSON(inputs.candidate_json).candidate.version }}
          TARGET: ${{ matrix.target }}
        run: BOBS_FACTORY_TRIAL_SMOKE_BINARY="$RUNNER_TEMP/factory-prefix/bin/bobs-factory" node --test tooling/scripts/tests/trial-launcher.test.mjs tooling/scripts/tests/trial-launcher-bootstrap.test.mjs
      - name: Publisher signature interoperability
        run: node --test tooling/scripts/tests/release-signature.test.mjs
      - uses: actions/upload-artifact@v6
        with:
          name: bobs-factory-${{ matrix.target }}-${{ fromJSON(inputs.candidate_json).digest }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/artifacts/
          if-no-files-found: error
