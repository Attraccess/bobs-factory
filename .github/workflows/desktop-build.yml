name: Prepare unsigned desktop candidate
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main, feat/desktop-service-121-122-124]
    paths:
      - 'apps/desktop/**'
      - 'apps/cli/**'
      - 'packages/**'
      - 'scripts/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/desktop-build.yml'
  workflow_dispatch:
    inputs:
      candidate_json:
        description: Frozen candidate.json bytes (preparation only, never signing/publication)
        required: true
        type: string
permissions:
  contents: read
jobs:
  freeze:
    if: github.event_name == 'workflow_dispatch' || ((github.event.pull_request.head.ref == 'feat/desktop-service-121-122-124' || github.event.pull_request.head.ref == 'feat/desktop-shell-update-116' || (github.event.pull_request.number == 91 && github.event.pull_request.head.ref == 'delivery/taskbot-116-integration')) && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    outputs:
      candidate_json: ${{ steps.freeze.outputs.candidate_json }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || fromJSON(inputs.candidate_json).candidate.workflowSha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24.18.0'
          package-manager-cache: false
      - id: freeze
        name: Freeze exact unsigned preparation source/tooling
        env:
          EVENT_NAME: ${{ github.event_name }}
          SOURCE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || fromJSON(inputs.candidate_json).candidate.workflowSha }}
          CANDIDATE_JSON: ${{ inputs.candidate_json }}
          INTEGRATION_CANDIDATE: ${{ github.event.pull_request.number == 91 && github.event.pull_request.head.ref == 'delivery/taskbot-116-integration' }}
          PREPARATION_SEQUENCE: ${{ github.run_number }}
        run: |
          node --input-type=module <<'JS'
          import {appendFileSync, readFileSync} from 'node:fs';
          import {execFileSync} from 'node:child_process';
          import {freezeCandidate,validateCandidate} from './scripts/lib/release-candidate.mjs';
          const head=execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim();
          if(head!==process.env.SOURCE_SHA)throw Error('Preparation must use exact event head, never synthetic PR merge');
          const frozen=process.env.EVENT_NAME==='pull_request'
            ? freezeCandidate({channel:'nightly',commit:head,workflowSha:head,committedVersion:JSON.parse(readFileSync('apps/cli/package.json')).version,sequence:process.env.INTEGRATION_CANDIDATE==='true'?15:Number(process.env.PREPARATION_SEQUENCE),date:process.env.INTEGRATION_CANDIDATE==='true'?'2026-10-10T00:00:00Z':new Date().toISOString()})
            : validateCandidate(JSON.parse(process.env.CANDIDATE_JSON));
          if(frozen.candidate.workflowSha!==head)throw Error('Frozen tooling differs from selected event head');
          appendFileSync(process.env.GITHUB_OUTPUT,'candidate_json='+JSON.stringify(frozen)+'\n');
          console.log(JSON.stringify({preparationOnly:true,publication:false,source:frozen.candidate.commit,tooling:head,digest:frozen.digest,version:frozen.candidate.version}));
          JS
  binary:
    needs: freeze
    uses: ./.github/workflows/binary-build.yml
    with:
      candidate_json: ${{ needs.freeze.outputs.candidate_json }}
  desktop:
    needs: [freeze, binary]
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-arm64
            runner: macos-15
          - target: darwin-x64
            runner: macos-15-intel
          - target: linux-x64
            runner: ubuntu-24.04
          - target: linux-arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ fromJSON(needs.freeze.outputs.candidate_json).candidate.workflowSha }}
          path: tooling
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          ref: ${{ fromJSON(needs.freeze.outputs.candidate_json).candidate.commit }}
          path: source
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24.18.0'
          package-manager-cache: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - name: Verify frozen preparation identity
        env:
          CANDIDATE_JSON: ${{ needs.freeze.outputs.candidate_json }}
        run: |
          node --input-type=module <<'JS'
          import {writeFileSync} from 'node:fs';
          import {execFileSync} from 'node:child_process';
          import {validateCandidate} from './tooling/scripts/lib/release-candidate.mjs';
          const c=validateCandidate(JSON.parse(process.env.CANDIDATE_JSON));
          for(const [path,expected] of [['tooling',c.candidate.workflowSha],['source',c.candidate.commit]])if(execFileSync('git',['-C',path,'rev-parse','HEAD'],{encoding:'utf8'}).trim()!==expected)throw Error('Frozen checkout identity mismatch');
          writeFileSync(process.env.RUNNER_TEMP+'/candidate.json',process.env.CANDIDATE_JSON);
          JS
          corepack enable
          corepack prepare "$(node -p 'require("./source/package.json").packageManager')" --activate
      - run: pnpm install --frozen-lockfile
        working-directory: source
      - run: pnpm --filter 'bobs-factory...' build
        working-directory: source
      - run: pnpm --filter bobs-factory-desktop test
        working-directory: source
      - uses: actions/download-artifact@v6
        with:
          name: bobs-factory-${{ matrix.target }}-${{ fromJSON(needs.freeze.outputs.candidate_json).digest }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/runtime
      - name: Build desktop installers from the validated runtime bytes
        env:
          VERSION: ${{ fromJSON(needs.freeze.outputs.candidate_json).candidate.version }}
          TARGET: ${{ matrix.target }}
        run: |
          tar -xzf "$RUNNER_TEMP/runtime/bobs-factory-$VERSION-$TARGET.tar.gz" -C "$RUNNER_TEMP/runtime"
          node tooling/scripts/build-desktop.mjs --source-root source --candidate "$RUNNER_TEMP/candidate.json" --runtime "$RUNNER_TEMP/runtime/bobs-factory-$VERSION-$TARGET" --output "$RUNNER_TEMP/desktop"
      - name: Validate isolated native user-service ownership
        env:
          VERSION: ${{ fromJSON(needs.freeze.outputs.candidate_json).candidate.version }}
          TARGET: ${{ matrix.target }}
        run: node source/scripts/native-service-smoke.mjs "$RUNNER_TEMP/runtime/bobs-factory-$VERSION-$TARGET" > "$RUNNER_TEMP/desktop/native-service-receipt.json"
      - name: Validate native Electron menu Stop and maintenance race
        env:
          VERSION: ${{ fromJSON(needs.freeze.outputs.candidate_json).candidate.version }}
          TARGET: ${{ matrix.target }}
        run: |
          export BOBS_FACTORY_DESKTOP_BINARY="$RUNNER_TEMP/runtime/bobs-factory-$VERSION-$TARGET/bobs-factory"
          export HOME="$RUNNER_TEMP/desktop-os-home"
          mkdir -p "$HOME"
          if [ "${{ runner.os }}" = "Linux" ]; then
            xvfb-run -a source/apps/desktop/node_modules/.bin/electron --no-sandbox source/apps/desktop/test/native-smoke.mjs > "$RUNNER_TEMP/desktop/native-electron-receipt.json"
          else
            source/apps/desktop/node_modules/.bin/electron source/apps/desktop/test/native-smoke.mjs > "$RUNNER_TEMP/desktop/native-electron-receipt.json"
          fi
      - name: Validate actual Linux complete shell upgrade and rollback
        if: runner.os == 'Linux'
        env:
          VERSION: ${{ fromJSON(needs.freeze.outputs.candidate_json).candidate.version }}
          TARGET: ${{ matrix.target }}
        working-directory: source
        run: |
          xvfb-run -a node apps/desktop/test/native-shell-update.mjs "$RUNNER_TEMP/desktop/bobs-factory-desktop-$VERSION-linux-$(node -p 'process.arch').AppImage" "$RUNNER_TEMP/runtime/bobs-factory-$VERSION-$TARGET" "$RUNNER_TEMP/candidate.json" > "$RUNNER_TEMP/desktop/native-shell-update-pending.json"
          node ../tooling/scripts/verify-native-fixture-cleanup.mjs "$RUNNER_TEMP/desktop/native-shell-update-pending.json" "$RUNNER_TEMP/desktop/native-shell-update-receipt.json"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: desktop-${{ matrix.target }}-${{ fromJSON(needs.freeze.outputs.candidate_json).digest }}
          path: |
            ${{ runner.temp }}/desktop/*.bobsapp.gz
            ${{ runner.temp }}/desktop/desktop-update-*.json
            ${{ runner.temp }}/desktop/*.dmg
            ${{ runner.temp }}/desktop/*.AppImage
            ${{ runner.temp }}/desktop/*.deb
            ${{ runner.temp }}/desktop/desktop-build.json
            ${{ runner.temp }}/desktop/native-service-receipt.json
            ${{ runner.temp }}/desktop/native-electron-receipt.json
            ${{ runner.temp }}/desktop/native-shell-update-receipt.json
            ${{ runner.temp }}/desktop/native-shell-update-pending.json
            ${{ runner.temp }}/runtime/*.tar.gz
